<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖片轉文字與語音 (升級版)</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        /* 拖曳/貼上區塊與上傳按鈕的整合設計 */
        .upload-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }
        #paste-area {
            border: 2px dashed #ccc;
            padding: 30px;
            text-align: center;
            color: #666;
            border-radius: 8px;
            background-color: #fafafa;
        }
        .upload-btn {
            display: inline-block;
            padding: 12px 20px;
            background-color: #28a745;
            color: white;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .upload-btn:hover {
            background-color: #218838;
        }
        /* 隱藏預設的檔案上傳 input */
        #file-upload {
            display: none;
        }

        #preview-img {
            max-width: 100%;
            max-height: 300px;
            display: none;
            margin: 10px auto;
            border-radius: 4px;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
            font-size: 16px;
        }
        
        /* 控制區塊設計 */
        .controls {
            margin-top: 15px;
            display: flex;
            flex-wrap: wrap; /* 讓手機版版面能自動換行 */
            gap: 15px;
            align-items: center;
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
        }
        .settings-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-grow: 1;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            white-space: nowrap;
        }
        button:hover {
            background-color: #0056b3;
        }
        .stop-btn {
            background-color: #dc3545;
        }
        .stop-btn:hover {
            background-color: #c82333;
        }
        #status {
            color: #d9534f;
            font-weight: bold;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🖼️ 圖片文字讀取器</h2>
    
    <div class="upload-section">
        <label for="file-upload" class="upload-btn">📁 從裝置選擇圖片 (或拍照)</label>
        <input type="file" id="file-upload" accept="image/*">

        <div id="paste-area">
            電腦版也可以直接在這裡按下 <strong>Ctrl + V</strong> 貼上圖片
            <img id="preview-img" alt="圖片預覽">
        </div>
    </div>

    <div id="status"></div>

    <h3>辨識結果：</h3>
    <textarea id="result-text" placeholder="辨識出的文字會顯示在這裡..."></textarea>
    
    <div class="controls">
        <div class="settings-group">
            <label for="rate-slider"><strong>語速：</strong></label>
            <input type="range" id="rate-slider" min="0.5" max="2.0" step="0.1" value="1.0">
            <span id="rate-value">1.0x</span>
        </div>

        <div class="btn-group">
            <button onclick="speakText()">🔊 唸出文字</button>
            <button onclick="stopSpeaking()" class="stop-btn">⏹️ 停止播放</button>
        </div>
    </div>
</div>

<script>
    const pasteArea = document.getElementById('paste-area');
    const previewImg = document.getElementById('preview-img');
    const resultText = document.getElementById('result-text');
    const statusMsg = document.getElementById('status');
    const fileUpload = document.getElementById('file-upload');
    const rateSlider = document.getElementById('rate-slider');
    const rateValue = document.getElementById('rate-value');

    // 處理圖片顯示與辨識的共用函數
    function handleImage(imageFile) {
        // 顯示圖片預覽
        const imageUrl = URL.createObjectURL(imageFile);
        previewImg.src = imageUrl;
        previewImg.style.display = 'block';
        
        // 開始辨識文字
        recognizeText(imageFile);
    }

    // 監聽：選擇檔案上傳 (支援手機拍照或相簿)
    fileUpload.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            handleImage(file);
        }
    });

    // 監聽：貼上事件 (支援電腦版 Ctrl+V)
    window.addEventListener('paste', (e) => {
        const items = (e.clipboardData || e.originalEvent.clipboardData).items;
        for (let item of items) {
            if (item.type.indexOf('image') !== -1) {
                const imageFile = item.getAsFile();
                handleImage(imageFile);
                break;
            }
        }
    });

    // 監聽：語速拉桿數值變化
    rateSlider.addEventListener('input', (e) => {
        rateValue.innerText = e.target.value + 'x';
    });

    // 圖片轉文字 (OCR)
    async function recognizeText(file) {
        statusMsg.style.color = '#007bff';
        statusMsg.innerText = '正在載入引擎並辨識文字中，請稍候...';
        resultText.value = '';

        try {
            const worker = await Tesseract.createWorker('chi_tra+eng');
            const ret = await worker.recognize(file);
            await worker.terminate();

            const text = ret.data.text.trim();
            if(text === '') {
                statusMsg.style.color = '#d9534f';
                statusMsg.innerText = '圖片中沒有辨識到文字。';
            } else {
                resultText.value = text;
                statusMsg.style.color = 'green';
                statusMsg.innerText = '辨識完成！正在為您朗讀...';
                
                speakText(text);
            }
        } catch (error) {
            console.error(error);
            statusMsg.style.color = '#d9534f';
            statusMsg.innerText = '辨識過程發生錯誤。';
        }
    }

    // 文字轉語音 (TTS)
    function speakText(textToSpeak) {
        const text = textToSpeak || resultText.value;
        
        if (!text) {
            alert('沒有可以唸出的文字！');
            return;
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); 

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-TW'; 
            
            // 讀取拉桿的數值設定語速
            utterance.rate = parseFloat(rateSlider.value); 
            utterance.pitch = 1.0;

            utterance.onend = function() {
                if(statusMsg.innerText.includes('正在為您朗讀')) {
                    statusMsg.innerText = '朗讀完畢。';
                }
            };

            window.speechSynthesis.speak(utterance);
     } else {
            alert('您的瀏覽器不支援語音功能。\n\n如果您是用 LINE 或 FB 打開此網頁，請點擊右上角/右下角的選單，選擇「以預設瀏覽器開啟」(或用 Chrome / Safari 開啟) 就能正常使用了！');
        }
    }

    // 停止語音
    function stopSpeaking() {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
        }
    }
</script>

</body>
</html>
